services:
  Kachkaev\AssetsVersionBundle\Command\IncrementCommand:
    arguments:
      - '@kachkaev_assets_version.assets_version_manager'
      - '%kachkaev_assets_version.parameter_name%'
      - '%kachkaev_assets_version.file_path%'
    tags:
      - { name: 'console.command', command: 'assets-version:increment', description: 'Increments assets version parameter' }
  Kachkaev\AssetsVersionBundle\Command\SetCommand:
    arguments:
      - '@kachkaev_assets_version.assets_version_manager'
      - '%kachkaev_assets_version.parameter_name%'
      - '%kachkaev_assets_version.file_path%'
    tags:
      - { name: 'console.command', command: 'assets-version:set', description: 'Sets assets version parameter to a given value' }
